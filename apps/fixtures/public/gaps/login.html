<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/site.css"><title>Sign in</title></head><body><main><h1>Sign in</h1>
<form id="login" onsubmit="event.preventDefault(); document.querySelector('main').innerHTML='<h1>Signed in</h1><p>Welcome back.</p>'">
<p><label for="email">Email</label><br><input id="email" name="email" type="email" autocomplete="username" required></p>
<p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password" required></p>
<button class="btn">Sign in</button>
</form></main></body></html>
