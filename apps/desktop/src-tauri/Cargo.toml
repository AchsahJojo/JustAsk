[package]
name = "justask-desktop"
version = "0.1.0"
edition = "2021"
default-run = "justask-desktop"

[lib]
name = "justask_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# native-windows agent owns this section (docs/refined-plan-2.md, agent 6).
[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Registry"] }
